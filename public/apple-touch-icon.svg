    <line x1="32" y1="48" x2="148" y2="48" />
    <circle cx="32" cy="48" r="4.5" fill="#A88445" stroke="none" />
    <circle cx="148" cy="48" r="4.5" fill="#A88445" stroke="none" />

    <line x1="42" y1="48" x2="42" y2="146" stroke-width="5" />
    <line x1="138" y1="48" x2="138" y2="146" stroke-width="5" />

    <line x1="28" y1="146" x2="56" y2="146" stroke-width="6" />
