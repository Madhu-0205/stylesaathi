  <circle cx="12" cy="18" r="1.75" fill="#A88445"/>
  <circle cx="52" cy="18" r="1.75" fill="#A88445"/>

  <!-- Uprights & Feet -->
  <line x1="16" y1="18" x2="16" y2="52" stroke="#171514" stroke-width="2" stroke-linecap="round"/>
  <line x1="48" y1="18" x2="48" y2="52" stroke="#171514" stroke-width="2" stroke-linecap="round"/>
